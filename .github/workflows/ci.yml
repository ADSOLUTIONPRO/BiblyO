# Contrôles de chaque envoi : lint, types, gardes du dépôt, tests, parcours dans un navigateur.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Python 3.12
        run: uv python install 3.12
      - name: Dépendances verrouillées
        run: uv sync --frozen
      - name: Tailwind (binaire épinglé, empreinte vérifiée)
        run: python3 scripts/build_css.py --telecharger linux-x64 && uv run --frozen python scripts/build_css.py
      - name: make check
        run: make check
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt && uvx pip-audit -r requirements.txt --disable-pip

  navigateur:
    runs-on: ubuntu-24.04
    needs: controles
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv python install 3.12 && uv sync --frozen
      - run: python3 scripts/build_css.py --telecharger linux-x64
      - run: uv run --frozen playwright install --with-deps chromium
      - name: Parcours de bout en bout (Chromium)
        run: make e2e
        env:
          BIBLYO_E2E_NAVIGATEUR: chromium
