# Publication d'une version : sur une étiquette vX.Y.Z seulement.
# Ordre : contrôles → image construite (linux/amd64, base figée par empreinte) → analyse des vulnérabilités → recette
# complète du paquet distribué (deploy/synology/compose.yaml) → SEULEMENT ALORS envoi vers GHCR → l'image retéléchargée
# par son empreinte doit être celle qui a été éprouvée → version GitHub avec l'empreinte et les fichiers d'installation.
name: Publication

# Lancée à la main (workflow_dispatch), elle fait une RÉPÉTITION : construction, analyse et recette, sans aucun envoi
# vers GHCR ni version GitHub.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    uses: ./.github/workflows/ci.yml

  image:
    needs: controles
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/adsolutionpro/biblyo
    steps:
      - uses: actions/checkout@v4

      - name: Version de l'étiquette = version du code = version du compose
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; PUBLIER=true
            python3 scripts/check_titulaire.py --publication
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"; PUBLIER=false
            echo "Répétition : version $VERSION, rien ne sera publié."
          fi
          grep -q "^version = \"$VERSION\"" pyproject.toml || { echo "pyproject.toml n'est pas en $VERSION"; exit 1; }
          grep -q "__version__ = \"$VERSION\"" src/biblyo/__init__.py || { echo "__version__ n'est pas $VERSION"; exit 1; }
          grep -q "image: $IMAGE:$VERSION$" deploy/synology/compose.yaml || { echo "compose.yaml ne désigne pas $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publier=$PUBLIER" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Tailwind (binaire épinglé, empreinte vérifiée)
        run: python3 scripts/build_css.py --telecharger linux-x64

      - uses: docker/setup-buildx-action@v3

      - name: Construction reproductible (linux/amd64)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg BIBLYO_COMMIT="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH \
            --provenance=false --sbom=false --output type=docker,rewrite-timestamp=true \
            -t "$IMAGE:${{ steps.version.outputs.version }}" .
          docker image inspect -f '{{.Id}}' "$IMAGE:${{ steps.version.outputs.version }}" | tee image-id.txt

      - name: Vulnérabilités de l'image (critiques corrigeables bloquantes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Rapport complet des vulnérabilités (non bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy.txt

      - name: Recette du paquet distribué
        shell: bash  # -eo pipefail : un échec de la recette n'est jamais masqué par l'enregistrement du journal
        run: bash scripts/recette_distribution.sh "$IMAGE:${{ steps.version.outputs.version }}" 2>&1 | tee recette.txt

      # L'image redistribue des paquets Debian, dont certains sous GPL ou LGPL : la liste exacte de leurs paquets
      # source et versions accompagne chaque version, et leurs sources sont publiées au même endroit que l'image.
      - name: Composants de l'image (paquets Debian et Python, avec leurs licences)
        run: |
          IMG="$IMAGE:${{ steps.version.outputs.version }}"
          {
            echo "# Paquets Debian de l'image $IMG (paquet source, version source, paquet binaire, version)"
            echo "# Sources correspondantes : image $IMAGE:${{ steps.version.outputs.version }}-sources (GHCR), et archive"
            echo "# sources-debian-${{ steps.version.outputs.version }}.tar jointe à la version GitHub."
            echo "# Licences : /usr/share/doc/<paquet>/copyright dans l'image."
            docker run --rm --entrypoint dpkg-query "$IMG" -W -f '${source:Package} ${source:Version} ${Package} ${Version}\n'
          } > composants-image.txt
          docker run --rm --entrypoint /app/.venv/bin/python "$IMG" -c "import importlib.metadata as m; print('\n'.join(sorted(f'{d.metadata[\"Name\"]} {d.version} {d.metadata.get(\"License-Expression\") or d.metadata.get(\"License\") or \"(voir le paquet)\"}' for d in m.distributions())))" > composants-python.txt
          test -s composants-image.txt && test -s composants-python.txt
          wc -l composants-image.txt composants-python.txt

      - name: Sources correspondantes des paquets Debian (GPL, LGPL), à la version exacte
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash scripts/sources_image.sh "$IMAGE:$VERSION" sources
          sudo chown -R "$(id -u):$(id -g)" sources
          tar -cf "sources-debian-$VERSION.tar" -C sources .
          printf 'FROM scratch\nCOPY . /sources/\n' > sources/Dockerfile.sources
          docker build -q -f sources/Dockerfile.sources -t "$IMAGE:$VERSION-sources" \
            --label "org.opencontainers.image.description=Sources des paquets Debian de $IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/ADSOLUTIONPRO/BiblyO" sources
          ls -l "sources-debian-$VERSION.tar"

      - uses: docker/login-action@v3
        if: steps.version.outputs.publier == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Envoi vers GHCR, puis vérification par l'empreinte
        id: digest
        if: steps.version.outputs.publier == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT="${GITHUB_SHA::12}"
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:$VERSION-sources"
          REF="$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          DIGEST="${REF#*@}"
          TESTED="$(cat image-id.txt)"
          docker image rm "$IMAGE:$VERSION" "$IMAGE:sha-$SHORT"
          docker pull "$IMAGE@$DIGEST"
          [ "$(docker image inspect -f '{{.Id}}' "$IMAGE@$DIGEST")" = "$TESTED" ] || { echo "image téléchargée ≠ image éprouvée"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image éprouvée et publiée : $IMAGE:$VERSION@$DIGEST"

      - name: Version GitHub
        if: steps.version.outputs.publier == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.digest.outputs.digest }}"
          awk "/^## $VERSION\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          {
            echo
            echo "## Image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "- Empreinte (digest) : \`$DIGEST\`"
            echo "- Référence immuable : \`$IMAGE@$DIGEST\`"
            echo "- Plateforme : linux/amd64 ; commit : \`$GITHUB_SHA\`"
            echo "- Installation : INSTALLATION-SYNOLOGY.md ; fichiers joints : compose.yaml, .env.example"
            echo "- Mise à jour et retour arrière : MISE-A-JOUR.md ; sauvegarde et restauration : SAUVEGARDE-RESTAURATION.md"
            echo "- Recette : RECETTE-$VERSION.md (tests, parcours navigateur, mise à jour éprouvée) ; journal de la recette"
            echo "  de cette image : recette.txt ; vulnérabilités : trivy.txt"
            echo "- Licence et provenance : LICENSE (EUPL-1.2), NOTICE, THIRD_PARTY_NOTICES.md"
            echo "- Composants : composants-image.txt (paquets Debian), composants-python.txt ; sources correspondantes des"
            echo "  paquets Debian : sources-debian-$VERSION.tar (ci-dessous) et \`$IMAGE:$VERSION-sources\`"
          } >> notes.md
          cp deploy/synology/compose.yaml compose.yaml
          cp .env.example env.example
          gh release create "$GITHUB_REF_NAME" --title "biblyO $VERSION" --notes-file notes.md \
            compose.yaml "env.example#.env.example" trivy.txt composants-image.txt composants-python.txt "sources-debian-$VERSION.tar" \
            recette.txt INSTALLATION-SYNOLOGY.md docs/MISE-A-JOUR.md docs/SAUVEGARDE-RESTAURATION.md CHANGELOG.md \
            NOTICE THIRD_PARTY_NOTICES.md LICENSE "docs/rapports/RECETTE-$VERSION.md"
