[project]
name = "biblyo"
version = "1.1.0"
description = "biblyO : gestion de bibliothèque auto-hébergée, en français"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Choix provisoire, à confirmer avant toute publication (docs/conception/10-PROVENANCE-LICENCES.md).
license = "EUPL-1.2"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.37",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "babel>=2.15",
    "typer>=0.12",
    "tzdata>=2024.1",
    "pillow>=13.0,<14",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
biblyo = "biblyo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "playwright==1.52.0",
    "axe-playwright-python>=0.1.4",
    "pip-licenses>=5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biblyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not e2e and not live'"
markers = [
    "e2e: parcours de bout en bout dans un navigateur (make e2e)",
    "live: appelle un service externe réel (make contract)",
]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "S311"]
"scripts/**" = ["S603", "S607", "S310"]
"src/biblyo/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["src/biblyo/core", "src/biblyo/config.py", "src/biblyo/modules/catalogue", "src/biblyo/modules/holdings", "src/biblyo/modules/patrons", "src/biblyo/modules/circulation", "src/biblyo/modules/enrichment"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["biblyo"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
